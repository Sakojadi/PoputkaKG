<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poputka Admin">
    <meta name="format-detection" content="telephone=no">
    <title>{% block title %}Панель управления | Poputka Bot{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #111827;
            --bg-card: rgba(17, 24, 39, 0.75);
            --bg-card-hover: rgba(31, 41, 55, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(59, 130, 246, 0.5);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-primary: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --sidebar-width: 260px;
            --mobile-header-height: 58px;
            --mobile-nav-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            overflow-x: hidden;
            overscroll-behavior-y: none;
            -webkit-text-size-adjust: 100%;
        }

        /* Mobile Top Header Bar (Phone only) */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(var(--mobile-header-height) + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 0 16px;
            align-items: center;
            justify-content: space-between;
        }

        .mobile-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .mobile-brand .brand-logo {
            width: 34px;
            height: 34px;
            font-size: 17px;
            border-radius: 9px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .mobile-brand .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .mobile-header-logout {
            color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.25);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .mobile-header-logout:active {
            transform: scale(0.95);
            background: rgba(244, 63, 94, 0.2);
        }

        /* Desktop Sidebar (Hidden on phones) */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 200;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .sidebar-brand {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-menu {
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            min-height: 44px;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-item:active {
            transform: scale(0.98);
        }

        .nav-item.active {
            color: #fff;
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logout-btn {
            color: var(--accent-rose);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            min-height: 40px;
        }

        .logout-btn:hover {
            background: rgba(244, 63, 94, 0.1);
        }

        /* Mobile Bottom Navigation Bar (Phone only) */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--mobile-nav-height);
            background: rgba(17, 24, 39, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            z-index: 100;
            padding: 0 4px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }

        .mobile-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 72px;
            min-height: 48px;
        }

        .mobile-nav-btn i {
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .mobile-nav-btn.active {
            color: #60a5fa;
        }

        .mobile-nav-btn.active i {
            transform: scale(1.15);
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mobile-nav-btn:active {
            transform: scale(0.92);
        }

        /* Main Content Wrapper */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 32px 40px;
            max-width: calc(100vw - var(--sidebar-width));
            width: 100%;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.25;
        }

        .page-title p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Stat cards that drill down into a filtered table */
        a.card {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        a.card:active { transform: scale(0.98); }

        a.card .stat-link {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        a.card:hover .stat-link { color: #60a5fa; }

        .stat-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .icon-blue { background: rgba(59, 130, 246, 0.15); color: var(--accent-primary); }
        .icon-green { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }
        .icon-purple { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
        .icon-amber { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }

        .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
            word-break: break-word;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        /* Responsive Tables */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 24px;
        }

        .table-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .table-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            min-width: 600px;
        }

        th {
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-secondary);
            padding: 14px 18px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-stopped { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
        .badge-completed { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            min-height: 40px;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.92;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .btn-danger:hover {
            background: var(--accent-rose);
            color: #fff;
        }

        .btn-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: var(--accent-emerald);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 16px; /* 16px prevents iOS Safari zoom on focus */
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Alert Toast */
        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
        .alert-error { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .sidebar {
                display: none !important; /* Completely hide side dashboard on phones/mobile */
            }

            .mobile-header {
                display: flex;
            }

            .mobile-bottom-nav {
                display: flex;
            }

            .main-wrapper {
                margin-left: 0 !important;
                max-width: 100vw !important;
                padding-top: calc(var(--mobile-header-height) + env(safe-area-inset-top) + 14px);
                padding-bottom: calc(var(--mobile-nav-height) + env(safe-area-inset-bottom) + 24px);
                padding-left: max(14px, env(safe-area-inset-left));
                padding-right: max(14px, env(safe-area-inset-right));
            }

            .page-header {
                margin-bottom: 20px;
            }

            .page-title h2 {
                font-size: 20px;
            }

            .page-title p {
                font-size: 13px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 20px;
            }

            .card {
                padding: 16px;
                border-radius: 14px;
            }

            .stat-value {
                font-size: 20px;
            }

            .stat-icon {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .table-card {
                border-radius: 14px;
            }

            .table-header {
                padding: 14px 16px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .card {
                padding: 14px;
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-label {
                font-size: 12px;
            }

            .main-wrapper {
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
            }
        }

        /* ============================================================
           Toolbar: search + filters (used on campaigns & users tables)
           ============================================================ */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .search-field {
            position: relative;
            flex: 1 1 240px;
            min-width: 0;
        }

        .search-field .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        .search-field .form-control {
            padding-left: 40px;
            padding-right: 40px;
            min-height: 44px;
        }

        .search-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }

        .search-clear:active { transform: translateY(-50%) scale(0.9); }

        .filter-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            min-height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-toggle:active { transform: scale(0.96); }
        .filter-toggle.has-filters {
            border-color: var(--border-active);
            background: rgba(59, 130, 246, 0.12);
            color: #93c5fd;
        }

        .filter-toggle .filter-count {
            background: var(--accent-primary);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .filter-toggle .chevron { transition: transform 0.25s ease; font-size: 11px; }
        .filter-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

        /* Filter panel */
        .filter-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.22);
        }

        .filter-panel[hidden] { display: none; }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .filter-group.span-all { grid-column: 1 / -1; }

        .filter-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 13px;
            min-height: 38px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
            user-select: none;
        }

        .chip input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .chip:active { transform: scale(0.95); }

        .chip.is-active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.28);
        }

        .chip i { font-size: 11px; }

        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 38px;
            min-height: 44px;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        select.form-control option { background: #111827; color: #f9fafb; }

        /* Result summary strip under the toolbar */
        .result-strip {
            display: flex;
            align-items: center;
            gap: 8px 18px;
            flex-wrap: wrap;
            padding: 11px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.12);
        }

        .result-strip strong { color: var(--text-primary); font-weight: 700; }
        .result-strip .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); }

        /* Removable pills showing which filters are on */
        .active-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 12px 20px 0 20px;
        }

        .active-pills:empty { display: none; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.14);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .pill i { font-size: 10px; opacity: 0.8; }
        .pill:active { transform: scale(0.94); }

        .pill-reset {
            background: rgba(244, 63, 94, 0.12);
            border-color: rgba(244, 63, 94, 0.3);
            color: #fb7185;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination .btn { min-height: 44px; padding: 10px 16px; }

        .pagination .page-indicator {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 0 10px;
            white-space: nowrap;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 44px 20px;
            color: var(--text-muted);
        }

        .empty-state i { font-size: 30px; opacity: 0.35; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; line-height: 1.5; }

        /* Row action cluster */
        .row-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row-actions form { display: inline-flex; margin: 0; }

        /* Dismissible alert */
        .alert { position: relative; padding-right: 46px; }

        .alert-close {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Scroll-to-top helper (mobile) */
        .scroll-top {
            display: none;
            position: fixed;
            right: 14px;
            bottom: calc(var(--mobile-nav-height) + 18px + env(safe-area-inset-bottom));
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(31, 41, 55, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            z-index: 90;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        .scroll-top.visible { opacity: 1; transform: translateY(0); }

        /* Modal / bottom sheet shell */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open { display: flex; }

        .modal-sheet {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
            position: relative;
            max-height: 88vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            animation: modal-in 0.22s ease;
        }

        @keyframes modal-in {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: none; }
        }

        @keyframes sheet-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-handle { display: none; }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
        }

        /* Utility */
        .mobile-only { display: none !important; }
        .nowrap { white-space: nowrap; }


        /* Publication progress bar (campaign rows) */
        .progress {
            width: 100%;
            max-width: 120px;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-top: 6px;
        }

        .progress span {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: var(--accent-gradient);
        }

        .progress.is-done span { background: var(--accent-emerald); }

        /* Inline user trigger inside tables */
        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 11px;
            min-height: 34px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .user-chip:hover { background: rgba(59, 130, 246, 0.14); border-color: var(--border-active); }
        .user-chip:active { transform: scale(0.95); }
        .user-chip i { color: #60a5fa; font-size: 11px; }

        /* Ad thumbnail + text preview */
        .ad-preview { display: flex; gap: 10px; align-items: flex-start; }

        .ad-thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .ad-thumb:active { transform: scale(0.94); }

        .ad-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            .ad-thumb { width: 60px; height: 60px; }
            .progress { max-width: none; }
            .data-table td.cell-block .ad-preview { text-align: left; }
        }

        /* ============================================================
           Tablet & phone: turn wide tables into readable stacked cards
           ============================================================ */
        @media (max-width: 768px) {
            .d-none-mobile { display: none !important; }
            .mobile-only { display: inline-flex !important; }

            .toolbar { padding: 12px 12px; gap: 8px; }
            .search-field { flex: 1 1 100%; }
            .filter-toggle { flex: 1 1 auto; justify-content: center; }
            .filter-panel { grid-template-columns: 1fr; gap: 14px; padding: 14px 12px; }
            .result-strip { padding: 10px 12px; font-size: 12px; }
            .active-pills { padding: 10px 12px 0 12px; }
            .chips { gap: 6px; }
            .chip { flex: 1 1 auto; justify-content: center; }

            .table-responsive { overflow: visible; }

            table.data-table {
                display: block;
                width: 100%;
                min-width: 0;
                font-size: 13px;
            }

            .data-table thead { display: none; }

            .data-table tbody {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 12px;
            }

            .data-table tr {
                display: block;
                border: 1px solid var(--border);
                border-radius: 14px;
                background: rgba(255, 255, 255, 0.025);
                overflow: hidden;
            }

            .data-table tr:hover td { background: transparent; }

            .data-table td {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 14px;
                padding: 10px 14px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                text-align: right;
                white-space: normal !important;
                min-width: 0 !important;
                max-width: none !important;
            }

            .data-table td::before {
                content: attr(data-label);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.4px;
                text-transform: uppercase;
                color: var(--text-muted);
                flex: 0 0 auto;
                text-align: left;
                padding-top: 2px;
            }

            .data-table td:last-child { border-bottom: none; }

            .data-table td.cell-head {
                background: rgba(255, 255, 255, 0.04);
                font-weight: 700;
                font-size: 14px;
                align-items: center;
                padding: 12px 14px;
            }

            .data-table td.cell-head::before { display: none; }

            .data-table td.cell-block {
                display: block;
                text-align: left;
            }

            .data-table td.cell-block::before {
                display: block;
                margin-bottom: 8px;
            }

            .data-table td.cell-actions {
                background: rgba(0, 0, 0, 0.22);
                padding: 12px 14px;
                display: block;
            }

            .data-table td.cell-actions::before { display: none; }

            .data-table td.cell-empty { display: block; text-align: center; }
            .data-table td.cell-empty::before { display: none; }

            .row-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                width: 100%;
                min-width: 0 !important;
            }

            .row-actions form { display: block; width: 100%; }
            .row-actions .btn { width: 100%; min-height: 42px; font-size: 13px !important; padding: 10px 8px !important; }
            .row-actions .btn.span-2 { grid-column: 1 / -1; }

            .pagination { gap: 6px; }
            .pagination .btn { flex: 1 1 0; }
            .pagination .page-indicator { flex: 0 0 auto; }

            .scroll-top { display: flex; }

            /* Modals become bottom sheets: reachable with one thumb */
            .modal-backdrop { align-items: flex-end; padding: 0; }

            .modal-sheet {
                max-width: none;
                border-radius: 22px 22px 0 0;
                border-bottom: none;
                max-height: 90vh;
                padding: 10px 16px calc(20px + env(safe-area-inset-bottom)) 16px;
                animation: sheet-up 0.26s cubic-bezier(0.32, 0.72, 0, 1);
            }

            .sheet-handle {
                display: block;
                width: 40px;
                height: 4px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.22);
                margin: 4px auto 14px auto;
            }

            .modal-close { top: 10px; right: 12px; }
        }

        @media (max-width: 380px) {
            .row-actions { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>

<body>

        </a>
    </header>

    <!-- Desktop Sidebar (Only on desktop >= 1024px) -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">🚀</div>
            <div class="brand-text">

        <nav class="nav-menu">

    <!-- Main Content Area -->

    <!-- Loading Top Progress Bar -->

    <!-- Back-to-top helper (phones: long filtered lists) -->
    <button type="button" class="scroll-top" id="scrollTopBtn" aria-label="Наверх">

    <!-- Mobile Bottom Navigation Bar (App-like UX on phones) -->
    <nav class="mobile-bottom-nav">

    <!-- Shared UI behaviours: filters, alerts, sheets, back-to-top -->
    <script>
        (function() {
            // --- Back to top (phones) ---
            const topBtn = document.getElementById('scrollTopBtn');
            if (topBtn) {
                const sync = () => topBtn.classList.toggle('visible', window.scrollY > 420);
                window.addEventListener('scroll', sync, { passive: true });
                topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
                sync();
            }

            // Re-runs after every SPA swap: everything here is idempotent.
            window.initPageUI = function() {
                // --- Dismissible alerts, auto-fading after a few seconds ---
                document.querySelectorAll('.alert:not([data-bound])').forEach(alert => {
                    alert.setAttribute('data-bound', '1');
                    if (!alert.querySelector('.alert-close')) {
                        const close = document.createElement('button');
                        close.type = 'button';
                        close.className = 'alert-close';
                        close.setAttribute('aria-label', 'Закрыть');
                        close.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        alert.appendChild(close);
                    }
                    const hide = () => {
                        alert.style.transition = 'opacity .3s ease, transform .3s ease';
                        alert.style.opacity = '0';
                        alert.style.transform = 'translateY(-6px)';
                        setTimeout(() => alert.remove(), 300);
                    };
                    alert.querySelector('.alert-close').addEventListener('click', hide);
                    setTimeout(hide, 6000);
                });

                // Drop the one-shot ?msg= so a refresh doesn't replay the toast
                if (window.location.search.includes('msg=')) {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('msg');
                    window.history.replaceState({}, '', url.pathname + (url.search || '') + url.hash);
                }

                // --- Filter panel toggle (collapsed by default on phones) ---
                document.querySelectorAll('[data-filter-toggle]:not([data-bound])').forEach(btn => {
                    btn.setAttribute('data-bound', '1');
                    const panel = document.getElementById(btn.getAttribute('data-filter-toggle'));
                    if (!panel) return;

                    // Keep the panel open on desktop, or when filters are already applied
                    const shouldOpen = window.innerWidth > 768 || btn.classList.contains('has-filters');
                    panel.hidden = !shouldOpen;
                    btn.setAttribute('aria-expanded', String(shouldOpen));

                    btn.addEventListener('click', () => {
                        const open = panel.hidden;
                        panel.hidden = !open;
                        btn.setAttribute('aria-expanded', String(open));
                    });
                });

                // --- Filter controls submit their form on change ---
                document.querySelectorAll('form[data-autosubmit]:not([data-bound])').forEach(form => {
                    form.setAttribute('data-bound', '1');
                    form.addEventListener('change', e => {
                        if (e.target.matches('input[type="radio"], select')) {
                            if (form.requestSubmit) form.requestSubmit(); else form.submit();
                        }
                    });
                });

                // --- Chip keyboard support (labels wrapping hidden radios) ---
                document.querySelectorAll('.chip:not([data-bound])').forEach(chip => {
                    chip.setAttribute('data-bound', '1');
                    chip.setAttribute('tabindex', '0');
                    chip.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            const input = chip.querySelector('input');
                            if (input) { input.checked = true; input.dispatchEvent(new Event('change', { bubbles: true })); }
                        }
                    });
                });

                // --- Clear-search button inside the search field ---
                document.querySelectorAll('[data-search-clear]:not([data-bound])').forEach(btn => {
                    btn.setAttribute('data-bound', '1');
                    btn.addEventListener('click', () => {
                        const field = btn.parentElement.querySelector('input[name="q"]');
                        if (!field) return;
                        field.value = '';
                        const form = btn.closest('form');
                        if (form) { if (form.requestSubmit) form.requestSubmit(); else form.submit(); }
                    });
                });
            };

            // Close any open modal with Escape / on backdrop tap
            document.addEventListener('keydown', e => {
                if (e.key !== 'Escape') return;
                document.querySelectorAll('.modal-backdrop.open').forEach(m => {
                    m.classList.remove('open');
                    document.body.style.overflow = '';
                });
            });

            document.addEventListener('click', e => {
                if (e.target.classList && e.target.classList.contains('modal-backdrop')) {
                    e.target.classList.remove('open');
                    document.body.style.overflow = '';
                }
            });

            window.initPageUI();
        })();
    </script>

    <!-- Seamless SPA Navigation Script -->
    <script>
        (function() {
            const bar = document.getElementById('spaProgressBar');
            const main = document.querySelector('.main-wrapper');

            // Any open sheet/lightbox belongs to the page we are leaving
            function closeAnyModal() {
                document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));
                document.body.style.overflow = '';
            }

            function startLoading() {
                bar.style.opacity = '1';
                bar.style.width = '35%';
                if (main) main.style.opacity = '0.65';
            }

            function finishLoading() {
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => { bar.style.width = '0%'; }, 300);
                }, 150);
                if (main) main.style.opacity = '1';
            }

            function updateActiveNav(newDoc) {
                // Update desktop sidebar
                const currentNavs = document.querySelectorAll('.nav-item');
                const newNavs = newDoc.querySelectorAll('.nav-item');
                currentNavs.forEach((item, idx) => {
                    if (newNavs[idx]) {
                        item.className = newNavs[idx].className;
                    }
                });

                // Update mobile bottom nav
                const currentMobileNavs = document.querySelectorAll('.mobile-nav-btn');
                const newMobileNavs = newDoc.querySelectorAll('.mobile-nav-btn');
                currentMobileNavs.forEach((item, idx) => {
                    if (newMobileNavs[idx]) {
                        item.className = newMobileNavs[idx].className;
                    }
                });
            }

            function executeScripts(container) {
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }

            async function navigateTo(url, push = true) {
                try {
                    startLoading();
                    const response = await fetch(url, { headers: { 'X-Requested-With': 'SPA' } });
                    
                    if (response.redirected && response.url.includes('/admin/login')) {
                        window.location.href = response.url;
                        return;
                    }

                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const newContent = doc.querySelector('.main-wrapper');
                    if (newContent && main) {
                        closeAnyModal();
                        main.innerHTML = newContent.innerHTML;
                        document.title = doc.title;
                        updateActiveNav(doc);
                        executeScripts(main);

                        if (push) {
                            window.history.pushState({ url: url }, '', url);
                        }
                        window.scrollTo({ top: 0, behavior: 'instant' });
                        if (window.initPageUI) window.initPageUI();
                    } else {
                        window.location.href = url;
                    }
                } catch (err) {
                    console.error('SPA navigation error:', err);
                    window.location.href = url;
                } finally {
                    finishLoading();
                }
            }

            // Intercept internal link clicks
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (!href) return;

                // Ignore external, anchor, target=_blank, and logout links
                if (
                    href.startsWith('/admin') &&
                    !href.startsWith('/admin/logout') &&
                    !link.getAttribute('target') &&
                    !link.hasAttribute('download') &&
                    !e.ctrlKey && !e.metaKey && !e.shiftKey
                ) {
                    e.preventDefault();
                    navigateTo(link.href, true);
                }
            });

            // Handle browser Back / Forward buttons
            window.addEventListener('popstate', function() {
                navigateTo(window.location.href, false);
            });

            // Intercept form submissions for instant feedback
            document.addEventListener('submit', async function(e) {
                const form = e.target;
                const action = form.getAttribute('action') || window.location.href;
                const method = (form.getAttribute('method') || 'GET').toUpperCase();

                if (action.startsWith('/admin') && !action.startsWith('/admin/logout') && !form.hasAttribute('data-no-spa')) {
                    e.preventDefault();
                    startLoading();
                    try {
                        let response;
                        if (method === 'POST') {
                            const formData = new FormData(form);
                            response = await fetch(action, {
                                method: 'POST',
                                body: formData
                            });
                        } else {
                            const params = new URLSearchParams(new FormData(form)).toString();
                            const fullUrl = action + (action.includes('?') ? '&' : '?') + params;
                            response = await fetch(fullUrl);
                        }

                        const targetUrl = response.url || action;
                        const html = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');

                        const newContent = doc.querySelector('.main-wrapper');
                        if (newContent && main) {
                            closeAnyModal();
                            main.innerHTML = newContent.innerHTML;
                            document.title = doc.title;
                            updateActiveNav(doc);
                            executeScripts(main);
                            window.history.pushState({ url: targetUrl }, '', targetUrl);
                            window.scrollTo({ top: 0, behavior: 'instant' });
                            if (window.initPageUI) window.initPageUI();
                        } else {
                            window.location.href = targetUrl;
                        }
                    } catch (err) {
                        console.error('SPA form submit error:', err);
                        form.submit();
                    } finally {
                        finishLoading();
                    }
                }
            });
        })();
    </script>
</body>
</html>
