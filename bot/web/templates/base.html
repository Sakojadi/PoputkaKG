<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Панель управления | Poputka Bot{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #111827;
            --bg-card: rgba(17, 24, 39, 0.75);
            --bg-card-hover: rgba(31, 41, 55, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(59, 130, 246, 0.5);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-primary: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --sidebar-width: 260px;
            --mobile-header-height: 58px;
            --mobile-nav-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Mobile Top Header Bar (Phone only) */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--mobile-header-height);
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 0 16px;
            align-items: center;
            justify-content: space-between;
        }

        .mobile-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .mobile-brand .brand-logo {
            width: 34px;
            height: 34px;
            font-size: 17px;
            border-radius: 9px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .mobile-brand .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .mobile-header-logout {
            color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.25);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .mobile-header-logout:active {
            transform: scale(0.95);
            background: rgba(244, 63, 94, 0.2);
        }

        /* Desktop Sidebar (Hidden on phones) */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 200;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .sidebar-brand {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-menu {
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            min-height: 44px;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-item:active {
            transform: scale(0.98);
        }

        .nav-item.active {
            color: #fff;
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logout-btn {
            color: var(--accent-rose);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            min-height: 40px;
        }

        .logout-btn:hover {
            background: rgba(244, 63, 94, 0.1);
        }

        /* Mobile Bottom Navigation Bar (Phone only) */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--mobile-nav-height);
            background: rgba(17, 24, 39, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            z-index: 100;
            padding: 0 4px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }

        .mobile-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 72px;
            min-height: 48px;
        }

        .mobile-nav-btn i {
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .mobile-nav-btn.active {
            color: #60a5fa;
        }

        .mobile-nav-btn.active i {
            transform: scale(1.15);
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mobile-nav-btn:active {
            transform: scale(0.92);
        }

        /* Main Content Wrapper */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 32px 40px;
            max-width: calc(100vw - var(--sidebar-width));
            width: 100%;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.25;
        }

        .page-title p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .icon-blue { background: rgba(59, 130, 246, 0.15); color: var(--accent-primary); }
        .icon-green { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }
        .icon-purple { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
        .icon-amber { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }

        .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
            word-break: break-word;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        /* Responsive Tables */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 24px;
        }

        .table-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .table-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            min-width: 600px;
        }

        th {
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-secondary);
            padding: 14px 18px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-stopped { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
        .badge-completed { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            min-height: 40px;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.92;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .btn-danger:hover {
            background: var(--accent-rose);
            color: #fff;
        }

        .btn-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: var(--accent-emerald);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 16px; /* 16px prevents iOS Safari zoom on focus */
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Alert Toast */
        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
        .alert-error { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .sidebar {
                display: none !important; /* Completely hide side dashboard on phones/mobile */
            }

            .mobile-header {
                display: flex;
            }

            .mobile-bottom-nav {
                display: flex;
            }

            .main-wrapper {
                margin-left: 0 !important;
                max-width: 100vw !important;
                padding: calc(var(--mobile-header-height) + 14px) 14px calc(var(--mobile-nav-height) + 24px) 14px;
            }

            .page-header {
                margin-bottom: 20px;
            }

            .page-title h2 {
                font-size: 20px;
            }

            .page-title p {
                font-size: 13px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 20px;
            }

            .card {
                padding: 16px;
                border-radius: 14px;
            }

            .stat-value {
                font-size: 20px;
            }

            .stat-icon {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .table-card {
                border-radius: 14px;
            }

            .table-header {
                padding: 14px 16px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .card {
                padding: 14px;
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-label {
                font-size: 12px;
            }

            .main-wrapper {
                padding-left: 10px;
                padding-right: 10px;
            }

            .d-none-mobile {
                display: none;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Mobile Top Header Bar (Only on phones) -->
    <header class="mobile-header">
        <a href="/admin" class="mobile-brand">
            <div class="brand-logo">🚀</div>
            <div class="brand-text">
                <h1>Poputka Admin</h1>
            </div>
        </a>
        <a href="/admin/logout" class="mobile-header-logout" title="Выйти">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Выйти</span>
        </a>
    </header>

    <!-- Desktop Sidebar (Only on desktop >= 1024px) -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">🚀</div>
            <div class="brand-text">
                <h1>Poputka Admin</h1>
                <p>Управление ботом</p>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="/admin" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Дашборд</span>
            </a>
            <a href="/admin/campaigns" class="nav-item {% if active_page == 'campaigns' %}active{% endif %}">
                <i class="fa-solid fa-rectangle-ad"></i>
                <span>Реклама & Посты</span>
            </a>
            <a href="/admin/users" class="nav-item {% if active_page == 'users' %}active{% endif %}">
                <i class="fa-solid fa-users"></i>
                <span>Пользователи</span>
            </a>
            <a href="/admin/broadcast" class="nav-item {% if active_page == 'broadcast' %}active{% endif %}">
                <i class="fa-solid fa-bullhorn"></i>
                <span>Рассылка & Промо</span>
            </a>
            <a href="/admin/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                <i class="fa-solid fa-sliders"></i>
                <span>Настройки</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="/admin/logout" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Выйти из панели</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Bottom Navigation Bar (App-like UX on phones) -->
    <nav class="mobile-bottom-nav">
        <a href="/admin" class="mobile-nav-btn {% if active_page == 'dashboard' %}active{% endif %}">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Дашборд</span>
        </a>
        <a href="/admin/campaigns" class="mobile-nav-btn {% if active_page == 'campaigns' %}active{% endif %}">
            <i class="fa-solid fa-rectangle-ad"></i>
            <span>Реклама</span>
        </a>
        <a href="/admin/users" class="mobile-nav-btn {% if active_page == 'users' %}active{% endif %}">
            <i class="fa-solid fa-users"></i>
            <span>Юзеры</span>
        </a>
        <a href="/admin/broadcast" class="mobile-nav-btn {% if active_page == 'broadcast' %}active{% endif %}">
            <i class="fa-solid fa-bullhorn"></i>
            <span>Рассылка</span>
        </a>
        <a href="/admin/settings" class="mobile-nav-btn {% if active_page == 'settings' %}active{% endif %}">
            <i class="fa-solid fa-sliders"></i>
            <span>Опции</span>
        </a>
    </nav>
</body>
</html>
