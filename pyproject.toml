[project]
name = "poputkabot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Salma", email = "231416196+salma-tenxdevs@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
poputkabot = "poputkabot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
